name: Build & Release Desktop & Mobile Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach binaries to (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            # GitHub retired the macos-13 image; this is the current Intel runner.
            runner: macos-15-intel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true

      - name: Install Dependencies
        run: vp i

      - name: Build macOS DMG
        env:
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--platform mac --target dmg --arch "${{ matrix.arch }}" --output-dir dist/desktop --build-version "${TAG#v}")
          if [[ -n "${CSC_LINK:-}" && -n "${CSC_KEY_PASSWORD:-}" ]]; then
            echo "Apple Developer signing secrets detected. Enabling --signed."
            if [[ -n "${APPLE_API_KEY:-}" && -n "${APPLE_API_KEY_ID:-}" ]]; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf "%s" "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"
            fi
            if [[ -n "${APPLE_TEAM_ID:-}" ]]; then
              export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
            fi
            args+=(--signed)
          else
            echo "No Apple signing secrets provided; building ad-hoc signed DMG."
          fi
          node scripts/build-desktop-artifact.ts "${args[@]}"

      - name: Upload DMG to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$TAG" dist/desktop/*.dmg --clobber

  build-windows-exe:
    name: Build Windows NSIS Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true

      - name: Install Dependencies
        run: vp i

      - name: Build Windows NSIS Installer
        env:
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --output-dir dist/desktop --build-version "${TAG#v}"

      - name: Upload EXE to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          gh release upload "$TAG" dist/desktop/*.exe --clobber

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Install System Libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true

      - name: Install Dependencies
        run: vp i

      - name: Build Linux AppImage
        env:
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: node scripts/build-desktop-artifact.ts --platform linux --target AppImage --arch x64 --output-dir dist/desktop --build-version "${TAG#v}"

      - name: Upload AppImage to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$TAG" dist/desktop/*.AppImage --clobber
